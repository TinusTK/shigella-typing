name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install and run the command
        run: |
          pip install .
          shigella-typing --version

  end-to-end:
    name: End-to-end tests (conda environment)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: Install
        run: pip install -e .
      - name: All tests, none skipped
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee test.log
          if grep -q "skipped" test.log; then echo "::error::tests were skipped"; exit 1; fi

  planemo-lint:
    name: Galaxy wrapper lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check wrappers exist
        id: xml
        run: |
          if ls tool/*.xml >/dev/null 2>&1; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "ready=false" >> "$GITHUB_OUTPUT";
               echo "::notice::Skipping planemo lint - no Galaxy wrappers yet"; fi
      - uses: actions/setup-python@v5
        if: steps.xml.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: planemo lint
        if: steps.xml.outputs.ready == 'true'
        run: |
          pip install planemo
          planemo lint --fail_level warn tool/
