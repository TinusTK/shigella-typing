class: GalaxyWorkflow
label: Shigella typing (three tools)
doc: |
  ShigaPass typing on assemblies, Mykrobe Shigella genotyping on reads and
  Combine Shigella report with cross-check warnings. Assemble the reads with
  your own assembler (e.g. Shovill mapped over the reads collection) so the
  assemblies keep the reads' element names; samples are matched by name.
creator:
  - class: Person
    name: TinusTK
license: GPL-3.0-or-later
release: "0.1.0"
inputs:
  reads:
    type: collection
    collection_type: list:paired
    doc: Paired reads, one element per sample (fastqsanger or fastqsanger.gz).
  assemblies:
    type: collection
    collection_type: list
    doc: Assemblies (FASTA), one element per sample, same element names as the reads.
outputs:
  combined_report:
    outputSource: combine/combined
  shigapass_report:
    outputSource: shigapass/report
  mykrobe_reports:
    outputSource: mykrobe/report
steps:
  shigapass:
    doc: ShigaPass typing - species and serotype from the assemblies.
    tool_id: toolshed.g2.bx.psu.edu/repos/tinustk/shigella_typing/shigapass_typing/0.1.0+galaxy0
    tool_version: 0.1.0+galaxy0
    in:
      assemblies: assemblies
    state:
      mykrobe:
        run: "no"
  mykrobe:
    doc: Mykrobe Shigella genotyping - genotype and QRDR mutations from each sample's reads.
    tool_id: toolshed.g2.bx.psu.edu/repos/tinustk/shigella_typing/mykrobe_shigella/0.1.0+galaxy0
    tool_version: 0.1.0+galaxy0
    in:
      reads|input: reads
    state:
      reads:
        type: paired
      scheme: auto
  combine:
    doc: Combine Shigella report - one row per sample with cross-check warnings.
    tool_id: toolshed.g2.bx.psu.edu/repos/tinustk/shigella_typing/shigella_typing_combine/0.1.0+galaxy0
    tool_version: 0.1.0+galaxy0
    in:
      shigapass: shigapass/report
      mykrobe: mykrobe/report
    state:
      strip_suffixes: false
